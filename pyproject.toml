[project]
name = "testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "crossfiledialog>=1.3.1",
    "customtkinter>=6.0.0",
    "discord>=2.3.2",
    "dotenv>=0.9.9",
    "mac-imessage>=0.3.0",
    "macos-messages>=0.2.0",
    "music-tag>=0.4.3",
    "patool>=4.1.0",
    "picotui>=1.2.1",
    "pillow>=12.3.0",
    "pyaudio>=0.2.14",
    "pygame>=2.6.1",
    "pyinstaller>=6.22.3",
    "pyttsx3>=2.99",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "speechrecognition==3.17.0",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
    "textual-image>=0.13.2",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
testing = "testing:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src"]
