<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc">
    <!-- Display Screen -->
    <div id="input_calc" class="ui input focus">
      <input style="font-size: 12pt; background-image: url('assets/Rectanglecalc.svg'); background-size: cover;" type="text" id="txt" readonly>
    </div>
    <!-- Row 1 -->
    <div class="button-row">
      <button type="button" STYLE="BACKGROUND-IMAGE: URL('ASSETS/Circled\ 7calc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value += '7'"></button>
      <button type="button" STYLE="BACKGROUND-IMAGE: URL('ASSETS/Circled\ 8calc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value += '8'"></button>
      <button type="button" STYLE="BACKGROUND-IMAGE: URL('ASSETS/Circled\ 9calc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value += '9'"></button>
      <button type="button" style="background-image: url('assets/Groupplus.svg');   background-size: cover;" onclick="txt.value += '+'"></button>
    </div>

    <!-- Row 2 -->
    <div class="button-row">
      <button type="button" STYLE="BACKGROUND-IMAGE: URL('ASSETS/Circled\ 4calc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value += '4'"></button>
      <button type="button" STYLE="BACKGROUND-IMAGE: URL('ASSETS/Html\ 5calc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value += '5'"></button>
      <button type="button" STYLE="BACKGROUND-IMAGE: URL('ASSETS/Circled\ 6calc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value += '6'"></button>
      <button type="button" style="background-image: url('assets/Groupcalc.svg');   background-size: cover;" onclick="txt.value += '-'"></button>
    </div>
    
    <!-- Row 3 -->
    <div>
        <button type="button" STYLE="BACKGROUND-IMAGE: URL('ASSETS/1Stcalc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value += '1'"></button>
        <button type="button" STYLE="BACKGROUND-IMAGE: URL('ASSETS/Circled\ 2calc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value += '2'"></button>
        <button type="button" STYLE="BACKGROUND-IMAGE: URL('ASSETS/Circled\ 3calc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value += '3'"></button>
        <button type="button" style="background-image: url('assets/Groupmultiply.svg');   background-size: cover;" onclick="txt.value += '*'"></button>
    </div>

      <div>
        <button type="button" style="background-image: url('assets/ccalc.svg');   background-size: cover;" 
          onclick="document.getElementById('txt').value = ''">
        </button>
        <button type="button" STYLE="BACKGROUND-IMAGE: URL('assets/Circled\ 0calc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value += '0'"></button>
        <button type="button" STYLE="BACKGROUND-IMAGE: URL('ASSETS/Equalscalc.svg');    BACKGROUND-SIZE: COVER;" onclick="txt.value = eval(txt.value)"></button>
        <button type="button" style="background-image: url('assets/Groupbaka.svg');   background-size: cover;" onclick="txt.value += '/'"></button>
      </div>    
  </div> 
</body> 
</html>
