[build-system]
requires = ["setuptools>=61.0.0", "wheel", "pathlib", "questionary"]
build-backend = "setuptools.build_meta"

[project]
name = "Tools"
version = "0.1.0"
description = "A collection of personal tools and utilities."

[tool.setuptools]
packages = ["Tools"]

[tool.setuptools.package-dir]
"" = "src"
